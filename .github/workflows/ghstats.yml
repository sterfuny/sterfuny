name: generate ghstats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: generate ghstats cards
        uses: tiennm99/ghstats@v1
        with:
          user: ${{ github.repository_owner }}
          token: ${{ secrets.GHSTATS_TOKEN }}
          themes: github_dark,github
          tz: Asia/Shanghai
          include_private: "true"
          commit_changes: "false"
          out: dist

      - name: keep only contribution and streak
        run: |
          mkdir -p tmp/github_dark tmp/github
          cp dist/github_dark/contributions-heatmap.svg tmp/github_dark/ 2>/dev/null || true
          cp dist/github_dark/streak.svg tmp/github_dark/ 2>/dev/null || true
          cp dist/github/contributions-heatmap.svg tmp/github/ 2>/dev/null || true
          cp dist/github/streak.svg tmp/github/ 2>/dev/null || true

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
